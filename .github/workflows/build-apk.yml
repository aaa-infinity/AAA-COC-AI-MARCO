name: AAA COC AI MARCO - Autonomous Cloud Builder & Monitor

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-monitor:
    name: Cloud Compilation & Automated Telegram Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Notify Telegram Build Started
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8841143616:AAGbcJKf3MLTN17-tpmwhZKZQIIbErDT1PA' }}
          TELEGRAM_CHAT_ID: "@aaafreecloud"
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s -F chat_id="${TELEGRAM_CHAT_ID}" \
                 -F text="🚀 [AAA COC AI MARCO] Cloud APK Build Started on GitHub Runner...%0ACommit: ${{ github.sha }}%0AStatus: Compiling Android Codebase with Gradle 8.7 & ML Kit Vision" \
                 https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage || true
          fi

      - name: Compile Commercial Debug APK
        id: gradle_build
        working-directory: android_app
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK to GitHub Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AAA-COC-AI-MARCO-APK
          path: android_app/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Send APK to Telegram Channel on Success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8841143616:AAGbcJKf3MLTN17-tpmwhZKZQIIbErDT1PA' }}
          TELEGRAM_CHAT_ID: "@aaafreecloud"
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            APK_FILE=$(find android_app/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
            if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
              FILE_SIZE=$(du -h "$APK_FILE" | cut -f1)
              echo "Found APK: $APK_FILE (Size: $FILE_SIZE)"
              curl -F chat_id="${TELEGRAM_CHAT_ID}" \
                   -F document=@"$APK_FILE" \
                   -F caption="✅ ⚔️ AAA COC AI MARCO v2.0 APK Build Success!%0A📦 Size: ${FILE_SIZE}%0A🐉 Home Village Zap Dragon Auto-Farming Ready%0A📱 Universal Android Compatibility + Google ML Kit Vision & Self-Healing Telemetry" \
                   https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument
            else
              echo "No APK file found to send"
            fi
          fi

      - name: Send Diagnostic Error Report to Telegram on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8841143616:AAGbcJKf3MLTN17-tpmwhZKZQIIbErDT1PA' }}
          TELEGRAM_CHAT_ID: "@aaafreecloud"
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s -F chat_id="${TELEGRAM_CHAT_ID}" \
                 -F text="❌ [AAA COC AI MARCO] Cloud APK Build Failed!%0A⚠️ Reason: Gradle Compilation Error%0A🔍 Commit: ${{ github.sha }}%0A🛠 Automatic diagnostic report logged." \
                 https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage || true
          fi
