name: Ai Marco coc - Cloud Builder & Monitor

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-monitor:
    name: Cloud Compilation & Automated Telegram Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Notify Telegram Build Started
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8841143616:AAGbcJKf3MLTN17-tpmwhZKZQIIbErDT1PA' }}
          TELEGRAM_CHAT_ID: "-1004447017934"
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=🚀+[Ai+Marco+coc+v5.0]+Cloud+APK+Build+Started+on+GitHub+Runner...%0ACommit:+${{ github.sha }}%0AStatus:+Compiling+with+Multi-Touch+Engine+%26+260%2B+Real+Assets" || true
          fi

      - name: Compile Commercial Debug APK
        id: gradle_build
        working-directory: android_app
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK to GitHub Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ai-Marco-coc-v5.0-APK
          path: android_app/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Send APK to Telegram Channel on Success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8841143616:AAGbcJKf3MLTN17-tpmwhZKZQIIbErDT1PA' }}
          TELEGRAM_CHAT_ID: "-1004447017934"
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            APK_FILE=$(find android_app/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
            if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
              FILE_SIZE=$(du -h "$APK_FILE" | cut -f1)
              echo "Found APK: $APK_FILE (Size: $FILE_SIZE)"
              curl -F "document=@${APK_FILE}" \
                   -F "caption=🐉 ⚔️ Ai Marco coc v5.0 Released!%0A📦 Size: ${FILE_SIZE}%0A🖐️ True Multi-Touch Gestures (4-Finger Wave & 2-Finger Funnel)%0A🛡️ Self-Independent Supervisor & Auto-Crash/Sync Recovery%0A✨ 260+ Real Datamined Transparent Supercell Assets (Pets, Defenses, Traps, Obstacles)%0A🤝 Clan Castle Auto-Request & Base Obstacle Cleaner%0A🎮 Auto-Launches Clash of Clans Directly%0A📱 Dark Cyber Glassmorphic UI" \
                   "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument?chat_id=${TELEGRAM_CHAT_ID}"
            else
              echo "No APK file found to send"
            fi
          fi

      - name: Send Diagnostic Error Report to Telegram on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8841143616:AAGbcJKf3MLTN17-tpmwhZKZQIIbErDT1PA' }}
          TELEGRAM_CHAT_ID: "-1004447017934"
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=❌+[Ai+Marco+coc]+Cloud+APK+Build+Failed!%0A⚠️+Reason:+Compilation+Error%0A🔍+Commit:+${{ github.sha }}" || true
          fi
