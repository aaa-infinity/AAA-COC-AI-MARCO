name: Ai Marco coc - Cloud Builder & Monitor

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-monitor:
    name: Cloud Compilation & Automated Telegram Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Notify Telegram Build Started
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8841143616:AAGbcJKf3MLTN17-tpmwhZKZQIIbErDT1PA' }}
          TELEGRAM_CHAT_ID: "-1004447017934"
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=🚀+Ai+Marco+coc+v11.5+(Master+Titan+Edition)+Cloud+APK+Build+Started+on+GitHub+Runner...%0ACommit:+${{ github.sha }}%0AStatus:+Compiling+All+Verified+Engines+%26+Macrorify+Play+Mode+HUD" || true
          fi

      - name: Compile Commercial Debug APK
        id: gradle_build
        working-directory: android_app
        run: |
          gradle assembleDebug --stacktrace --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Ai-Marco-coc-v11.5.apk

      - name: Upload APK to GitHub Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ai-Marco-coc-v11.5-APK
          path: dist/Ai-Marco-coc-v11.5.apk
          retention-days: 30

      - name: Send APK to Telegram Channel on Success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8841143616:AAGbcJKf3MLTN17-tpmwhZKZQIIbErDT1PA' }}
          TELEGRAM_CHAT_ID: "-1004447017934"
        run: |
          python3 tools/send_telegram_apk.py

      - name: Send Diagnostic Error Report to Telegram on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8841143616:AAGbcJKf3MLTN17-tpmwhZKZQIIbErDT1PA' }}
          TELEGRAM_CHAT_ID: "-1004447017934"
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=❌+[Ai+Marco+coc]+Cloud+APK+Build+Failed!%0A⚠️+Reason:+Compilation+Error%0A🔍+Commit:+${{ github.sha }}" || true
          fi
