name: Ai Marco coc - Cloud Builder & Monitor

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-monitor:
    name: Cloud Compilation & Automated Telegram Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Notify Telegram Build Started
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8841143616:AAGbcJKf3MLTN17-tpmwhZKZQIIbErDT1PA' }}
          TELEGRAM_CHAT_ID: "-1004447017934"
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=🚀+Ai+Marco+coc+v5.0+Cloud+APK+Build+Started+on+GitHub+Runner...%0ACommit:+${{ github.sha }}%0AStatus:+Compiling+with+Multi-Touch+Engine+%26+260%2B+Real+Assets" || true
          fi

      - name: Compile Commercial Debug APK
        id: gradle_build
        working-directory: android_app
        run: |
          gradle assembleDebug --stacktrace --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Ai-Marco-coc-v5.0.apk

      - name: Upload APK to GitHub Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ai-Marco-coc-v5.0-APK
          path: dist/Ai-Marco-coc-v5.0.apk
          retention-days: 30

      - name: Send APK to Telegram Channel on Success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8841143616:AAGbcJKf3MLTN17-tpmwhZKZQIIbErDT1PA' }}
          TELEGRAM_CHAT_ID: "-1004447017934"
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            APK_FILE="dist/Ai-Marco-coc-v5.0.apk"
            if [ -f "$APK_FILE" ]; then
              FILE_SIZE=$(du -h "$APK_FILE" | cut -f1)
              echo "Found APK: $APK_FILE (Size: $FILE_SIZE)"
              python3 -c "
import urllib.request, mimetypes, os

bot_token = os.environ.get('TELEGRAM_BOT_TOKEN')
chat_id = os.environ.get('TELEGRAM_CHAT_ID')
apk_path = 'dist/Ai-Marco-coc-v5.0.apk'
file_size = '$FILE_SIZE'

boundary = '----AiMarcoBoundary7MA4YWxkTrZu0gW'
caption = f'''🐉 ⚔️ <b>Ai Marco coc v5.0 Released!</b>
📦 <b>File:</b> Ai-Marco-coc-v5.0.apk ({file_size})
🖐️ <b>True Multi-Touch:</b> 4-Finger Line Wave & 2-Finger Funnel
🚨 <b>Panic Stop:</b> Physical Volume Down key override
🛡️ <b>Supervisor:</b> Auto-Crash & Disconnect Recovery
✨ <b>Assets:</b> 265+ Real Datamined Supercell PNG Sprites
⛵ <b>Builder Base:</b> 2.0 Instant Loop & Daily Ores
🤝 <b>Clan Suite:</b> Auto-Donate & CC Request
🎮 <b>Auto-Launch:</b> Direct Clash of Clans Game Launcher'''

with open(apk_path, 'rb') as f:
    file_bytes = f.read()

body = []
body.append(f'--{boundary}\r\nContent-Disposition: form-data; name=\"chat_id\"\r\n\r\n{chat_id}\r\n'.encode())
body.append(f'--{boundary}\r\nContent-Disposition: form-data; name=\"parse_mode\"\r\n\r\nHTML\r\n'.encode())
body.append(f'--{boundary}\r\nContent-Disposition: form-data; name=\"caption\"\r\n\r\n{caption}\r\n'.encode())
body.append(f'--{boundary}\r\nContent-Disposition: form-data; name=\"document\"; filename=\"Ai-Marco-coc-v5.0.apk\"\r\nContent-Type: application/vnd.android.package-archive\r\n\r\n'.encode())
body.append(file_bytes)
body.append(f'\r\n--{boundary}--\r\n'.encode())

payload = b''.join(body)
req = urllib.request.Request(
    f'https://api.telegram.org/bot{bot_token}/sendDocument',
    data=payload,
    headers={'Content-Type': f'multipart/form-data; boundary={boundary}'}
)
with urllib.request.urlopen(req, timeout=120) as resp:
    print('Telegram Dispatch Result:', resp.status)
"
            fi
          fi

      - name: Send Diagnostic Error Report to Telegram on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8841143616:AAGbcJKf3MLTN17-tpmwhZKZQIIbErDT1PA' }}
          TELEGRAM_CHAT_ID: "-1004447017934"
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=❌+[Ai+Marco+coc]+Cloud+APK+Build+Failed!%0A⚠️+Reason:+Compilation+Error%0A🔍+Commit:+${{ github.sha }}" || true
          fi
