name: Ai Marco coc - Cloud Builder & Monitor

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-monitor:
    name: Cloud Compilation & Automated Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compile Commercial Debug APK
        id: gradle_build
        working-directory: android_app
        run: |
          gradle assembleDebug --stacktrace --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Ai-Marco-coc-v1.0.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ai-Marco-coc-v1.0-APK
          path: dist/Ai-Marco-coc-v1.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0
          name: "Ai Marco coc v1.0 (Apex Vision & Pure Loot Edition)"
          body: |
            👑 **Ai Marco coc v1.0 (Apex Vision & Pure Loot Edition)**
            
            ### 🚀 Highlights:
            - 🎨 **New Brand Identity:** Pro Cyber Crown App Icon & Logo
            - 👁️ **On-Device Vision & OCR:** ML Kit instant Gold/Elixir reading
            - 🧠 **Pure Loot Farming AI:** 100% resource extraction (Zero trophy worry)
            - 🎯 **Macrorify 8-Button Floating HUD:** 42dp bubble, pill bar, in-game ⚙ modal
            - 🛠️ **AMOLED Black Screen Saver:** Dims screen to 0% to save battery & prevent burn-in
            - ⚡ **0-Training Time Loops:** Instant back-to-back attacks
            - ⏩ **Battle Fast-Forward:** Auto-taps in-game speed multiplier
            - 🧱 **Builder Wall Dump:** Spends excess loot to walls via Builder Overview
            - 🤝 **Clan Chat Auto-Donate & CC Request Loop**
            - 🔑 **100% Dynamic Multi-Key Live Models:** Gemini / OpenRouter / Groq / DeepSeek
            - 🤖 **2-Way Telegram Remote:** `/status`, `/pause`, `/resume`, `/attack`, `/walls`, `/schedule`
            - 🛡️ **24/7 Foreground Service:** Persistent notification prevents OS kills
          files: |
            dist/Ai-Marco-coc-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send APK to Telegram Channel (If configured)
        run: |
          python3 tools/send_telegram_apk.py || true
